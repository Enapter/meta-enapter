pool ntp.enapter.com iburst
# Amazon Time Sync Service (link-local, only reachable on EC2; chrony marks
# it unreachable elsewhere and keeps using the pool above)
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
driftfile /var/lib/chrony/drift
makestep 60 10
local stratum 8
manual
allow all
logdir /var/log/chrony
rtcsync
